name: Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests & Build Release/Debug APKs
        run: ./gradlew test assembleRelease assembleDebug

      - name: Prepare Named APKs
        run: |
          mkdir -p dist
          VERSION_TAG="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION_TAG" =~ ^v[0-9] ]]; then
            RAW_VER=$(awk -F '"' '/versionName/ {print $2}' app/build.gradle.kts)
            VERSION_TAG="v${RAW_VER}"
          fi
          echo "Packaging version: $VERSION_TAG"
          cp app/build/outputs/apk/release/app-release.apk "dist/XHide-${VERSION_TAG}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/XHide-${VERSION_TAG}-debug.apk"

      - name: Upload XHide APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XHide-apks
          path: dist/*.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

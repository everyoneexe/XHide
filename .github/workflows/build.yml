name: Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests & Build Release/Debug APKs
        run: ./gradlew test assembleRelease assembleDebug

      - name: Prepare Named APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/XHide-v1.0.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/XHide-v1.0.0-debug.apk

      - name: Upload XHide Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XHide-v1.0.0-release
          path: dist/XHide-v1.0.0-release.apk

      - name: Upload XHide Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XHide-v1.0.0-debug
          path: dist/XHide-v1.0.0-debug.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XHide-v1.0.0-release.apk
            dist/XHide-v1.0.0-debug.apk
          generate_release_notes: true
